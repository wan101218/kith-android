# ── Kith 项目 Gradle 配置 ───────────────────────────────────────────────────
#
# 这台机器 16GB 内存、同时常驻 Android Studio + 多个开发工具，
# 曾经出现过 AAPT2 daemon 启动失败（"Process unexpectedly exit"、
# 报错信息会误导性地提示缺少 Windows Universal C Runtime）。
# 真实原因是**物理内存耗尽**：只剩 1 GB 可用时，Windows 无法为 aapt2.exe
# 创建子进程（或进程刚起就被回收），且因为进程没跑到能写 stderr 就被杀，
# 错误信息里看不到任何真实原因。
#
# 下面几项都是围绕「降低常驻内存」调的，不是为了构建速度。

# 堆保持 2G：实测守护进程 heap 使用率长期接近 0%，真正吃内存的是 metaspace
# 与 JIT/native 部分，所以限制 metaspace 而不是加大堆。
# 限制 metaspace 的上限，避免长时间存活的守护进程内存无界增长。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# 守护进程空闲 15 分钟就退出。
# 默认是 3 小时 —— 这正是「守护进程存活 37 分钟、构建 22 次后突然失败」的成因：
# 闲置的守护进程一直占着 1.5GB 不放，最后把内存逼到临界点。
org.gradle.daemon.idletimeout=900000

# 单模块工程，并行调度没有收益，只会多占内存。
org.gradle.parallel=false

# 复用上一次的构建产物，减少重复工作。
org.gradle.caching=true

# Kotlin 编译守护进程单独限一下堆，避免长期运行后膨胀。
kotlin.daemon.jvmargs=-Xmx1536m

# ── 可选：统一 Gradle 的 JDK ────────────────────────────────────────────────
# Gradle 按 JDK 区分守护进程。若 Android Studio（默认用自己的 JBR，
# 如 D:\ad1\jbr）与命令行（默认用 JAVA_HOME 的 JDK）不是同一个 JDK，
# **同一个项目会各起一个 2GB 的守护进程**，白白多吃掉一份内存。
#
# 遇到问题时可以二选一：
#   A. 让 Android Studio 跟随命令行：
#      Settings → Build, Execution, Deployment → Build Tools → Gradle
#      → Gradle JDK → 选与 JAVA_HOME 一致的 JDK
#   B. 或者直接在这里钉死一个 JDK（对两边的工具都生效）：
# org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.10.7-hotspot

# ── AndroidX / Kotlin ───────────────────────────────────────────────────────
android.useAndroidX=true
kotlin.code.style=official
# 每个库只生成自己的 R 类，减小 R 类体积
android.nonTransitiveRClass=true
